<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI行家助手 · 形式偏好投票</title>
<style>
:root{
  --blue:#1677ff; --blue-dark:#0958d9; --blue-soft:#EFF6FF; --blue-line:#BFDBFE;
  --ink:#16181D; --ink2:#3D424D; --ink3:#757B87; --ink4:#9CA3AF;
  --line:#E5E7EB; --line2:#F0F1F3; --bg:#F6F7F9; --card:#FFFFFF;
  --amber:#B45309; --amber-bg:#FEF6E7;
  --ok:#047857; --ok-bg:#EAF7F1;
  --red:#E72C35; --red-soft:#FDECEE; --red-line:#F6C9CD; --red-dark:#C41E28;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 100px}

.topbar{position:sticky;top:0;z-index:100;background:rgba(246,247,249,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.brand small{font-weight:500;font-size:11px;color:var(--ink3)}
.prog{flex:1;height:5px;border-radius:99px;background:var(--line2);overflow:hidden;min-width:60px}
.prog > i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.pill{font-size:12px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px}
h1{font-size:21px;line-height:1.4;margin:0 0 8px;letter-spacing:-.2px}
p{margin:0 0 10px}
.sub{color:var(--ink3);font-size:13.5px}
.b{font-weight:700}
.small{font-size:12.5px}
.muted{color:var(--ink3)}

.reward{background:linear-gradient(135deg,#fff7ed,#fef9c3);border:1.5px solid #fcd34d;border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-top:14px}
.reward-icon{font-size:26px;flex:none}
.reward-title{font-size:14px;font-weight:800;color:#92400e}
.reward-sub{font-size:12px;color:#b45309;margin-top:1px}

.alert{border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-top:12px;border:1px solid}
.alert.blue{background:var(--blue-soft);border-color:var(--blue-line);color:#1e40af}
.alert.red{background:var(--red-soft);border-color:var(--red-line);color:var(--red-dark)}
.alert.ok{background:var(--ok-bg);border-color:#A7F3D0;color:var(--ok)}

.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink4);background:#FAFAFB}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink3);font-weight:500}
.btn.ghost:hover{background:var(--line2);color:var(--ink)}
.bar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.bar .spacer{flex:1}

/* Demo对比区 */
.phones-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-top:16px}
@media(max-width:580px){.phones-row{grid-template-columns:1fr;gap:24px}}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.phone-name{font-size:13.5px;font-weight:700;color:var(--ink2);text-align:center}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;margin-left:5px}
.tag.a{background:#EFF6FF;color:var(--blue);border:1px solid var(--blue-line)}
.tag.b{background:#F0FDF4;color:#15803d;border:1px solid #BBF7D0}
.phone-shell{width:100%;max-width:280px;border:4px solid #1a1a1a;border-radius:24px;overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.20);background:#f5f5f5;display:flex;flex-direction:column}
.phone-bar-inner{background:#fff;text-align:center;font-size:12px;font-weight:600;padding:8px 0 5px;color:#111;border-bottom:1px solid #eee;letter-spacing:1px;flex-shrink:0}
.phone-iframe{width:100%;height:480px;border:none;display:block;background:#f5f5f5}
.pick-btn{width:100%;max-width:280px;padding:11px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink);transition:all .15s;text-align:center}
.pick-btn:hover{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.pick-btn.on{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(22,119,255,.3)}

/* 题卡 */
.q{border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);padding:20px;margin-top:14px;transition:border-color .2s}
.q.done{border-left:3px solid var(--blue)}
.q.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(231,44,53,.07)}
.qtop{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.qno{flex:none;width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.q.done .qno{background:var(--blue)}
.picked-badge{flex:none;font-size:11.5px;font-weight:700;color:#fff;background:var(--blue);border-radius:99px;padding:3px 10px;margin-top:2px;white-space:nowrap}
.picked-badge.none{background:var(--line2);color:var(--ink3);font-weight:600}
.qtext{font-size:15px;font-weight:700;line-height:1.5;letter-spacing:-.1px}
.qsub{font-size:12.5px;color:var(--ink3);margin-top:3px}

.opts{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.opt-btn{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:all .13s;width:100%}
.opt-btn:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.opt-btn.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1.5px var(--blue)}
.opt-circle{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;margin-top:3px;transition:all .13s}
.opt-btn.on .opt-circle{border-color:var(--blue);background:var(--blue)}
.opt-circle::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff;display:none}
.opt-btn.on .opt-circle::after{display:block}
.opt-label{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.5}
.opt-desc{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.5}

textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;transition:border-color .15s;resize:vertical;min-height:80px;line-height:1.6}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.09)}
textarea::placeholder{color:var(--ink4)}
.cnt-row{display:flex;justify-content:flex-end;font-size:12px;color:var(--ink4);margin-top:4px}

.done-hero{text-align:center;padding:20px 0 14px}
.done-icon{font-size:52px;margin-bottom:10px}
.done-title{font-size:21px;font-weight:800;color:var(--blue)}
.done-sub{font-size:14px;color:var(--ink3);margin-top:5px}
.summary-list{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary-row{padding:11px 15px;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:flex-start;background:#fff}
.summary-row:last-child{border-bottom:none}
.sq{font-size:12px;font-weight:700;color:var(--ink4);flex:none;margin-top:2px;width:22px}
.sa{font-size:13px;color:var(--blue);font-weight:600;margin-top:2px}
.st{font-size:12.5px;font-weight:600;color:var(--ink2)}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .22s ease forwards}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97)}
.foot{text-align:center;color:var(--ink4);font-size:12px;margin-top:24px;line-height:1.8}
</style>
</head>

let answers = {};
let submitted = false;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const countLen = s => (s||"").replace(/\s/g,"").length;

function getProgress(){
  const req=QUESTIONS.filter(q=>q.required);
  const done=req.filter(q=>!!answers[q.id]);
  return {done:done.length,total:req.length};
}
function renderTop(){
  const {done,total}=getProgress();
  const bar=$("#progBar"),txt=$("#progTxt");
  if(bar)bar.style.width=Math.round(done/total*100)+"%";
  if(txt)txt.textContent=done+" / "+total+" 题";
}

function renderAll(){
  const app=$("#app");
  if(submitted){app.innerHTML=renderDone();return;}
  let html=`
  <div class="card fade-up">
    <h1>AI行家助手 · 你更喜欢哪种形式？🤔</h1>
    <p class="sub">我们正在对比两种交互设计，想听听你的真实感受。<strong>约 1 分钟</strong>填完。</p>

    </div>

function renderNormalQ(q,i){
  const val=answers[q.id];
  const isDone=q.type==="radio"?!!val:true;
  let inner="";
  if(q.type==="radio"){
    inner=`<div class="opts">${q.options.map(o=>`
      <button class="opt-btn${val===o.value?" on":""}" onclick="pickOpt('${q.id}','${o.value}')">
        <span class="opt-circle"></span>
        <span>
          <span class="opt-label">${esc(o.label)}</span>
          ${o.desc?`<div class="opt-desc">${esc(o.desc)}</div>`:""}
        </span>
      </button>`).join("")}</div>`;
  } else if(q.type==="textarea"){
    const v=answers[q.id]||"";
    inner=`<textarea id="ta_${q.id}" placeholder="${esc(q.placeholder||"")}" oninput="setTA('${q.id}',this.value)">${esc(v)}</textarea>
      <div class="cnt-row">${countLen(v)>0?countLen(v)+" 字":""}</div>`;
  }
  return `<div class="q${isDone?" done":""} fade-up" id="q_${q.id}">
    <div class="qtop">
      <span class="qno">${i+1}</span>
      <div style="flex:1">
        <div class="qtext">${esc(q.text)}</div>
        ${q.sub?`<div class="qsub">${esc(q.sub)}</div>`:""}
      </div>
      <span class="picked-badge${isDone?"":" none"}">${isDone?(q.type==="textarea"?"选填":"✓ 已选"):(q.required?"必填":"选填")}</span>
    </div>
    ${inner}
  </div>`;
}

function pickDemo(qid,val){
  answers[qid]=val;
  const q=QUESTIONS.find(q=>q.id===qid);
  q.demos.forEach(d=>{
    const btn=document.querySelector(`[onclick="pickDemo('${qid}','${d.value}')"]`);
    if(btn){btn.classList.toggle("on",d.value===val);btn.textContent=d.value===val?"✓ 已选择这个方案":"选择这个方案";}
  });
  const card=document.getElementById("q_"+qid);
  if(card){
    card.classList.add("done");
    const pk=card.querySelector(".picked-badge");
    if(pk){pk.textContent="✓ 已选";pk.classList.remove("none");}
    const qno=card.querySelector(".qno");
    if(qno)qno.style.background="var(--blue)";
  }
  renderTop();
}

function pickOpt(qid,val){
  answers[qid]=val;
  const q=QUESTIONS.find(q=>q.id===qid);
  document.querySelectorAll(`#q_${qid} .opt-btn`).forEach((btn,i)=>{
    btn.classList.toggle("on",q.options[i].value===val);
  });
  const card=document.getElementById("q_"+qid);
  if(card){
    card.classList.add("done");
    const pk=card.querySelector(".picked-badge");
    if(pk){pk.textContent="✓ 已选";pk.classList.remove("none");}
    const qno=card.querySelector(".qno");
    if(qno)qno.style.background="var(--blue)";
  }
  renderTop();
}

function setTA(qid,val){
  answers[qid]=val;
  const len=countLen(val);
  const cnt=document.querySelector(`#q_${qid} .cnt-row`);
  if(cnt)cnt.textContent=len>0?len+" 字":"";
}

function doSubmit(){
  const errs=[];
  QUESTIONS.forEach((q,i)=>{
    if(!q.required)return;
    if(!answers[q.id])errs.push({id:q.id,msg:`第 ${i+1} 题「${q.text}」未选择`});
  });
  document.querySelectorAll(".q").forEach(e=>e.classList.remove("err","shake"));
  const box=$("#errBox");
  if(errs.length){
    errs.forEach(e=>{const el=document.getElementById("q_"+e.id);if(el){el.classList.add("err");void el.offsetWidth;el.classList.add("shake");}});
    box.innerHTML=`<div class="alert red"><b>还有 ${errs.length} 题未填</b><br>${errs.map(e=>"· "+esc(e.msg)).join("<br>")}</div>`;
    document.getElementById("q_"+errs[0].id).scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  box.innerHTML="";
  submitted=true;
  $("#app").innerHTML=renderDone();
  renderTop();
  window.scrollTo({top:0,behavior:"smooth"});
}

    <div class="alert ok" style="margin-top:12px">
      <div class="b" style="margin-bottom:3px">✅ 已收到你的反馈</div>
      <div>我们会综合大家的意见，持续优化 AI行家助手 的交互体验 💪</div>
    </div>
    <div class="summary-list">
      <div style="padding:10px 15px;background:#FAFAFB;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink3)">你的填写摘要</div>
      ${QUESTIONS.filter(q=>answers[q.id]).map((q,i)=>{
        let val=answers[q.id];
        if(q.type==="demo_pick"){const d=q.demos.find(d=>d.value===val);val=d?d.label:val;}
        else if(q.type==="radio"){const o=q.options.find(o=>o.value===val);val=o?o.label:val;}
        return `<div class="summary-row"><span class="sq">Q${i+1}</span><div><div class="st">${esc(q.text)}</div><div class="sa">${esc(val)}</div></div></div>`;
      }).join("")}
    </div>
    <div class="bar"><div class="spacer"></div><button class="btn ghost" onclick="location.reload()">重新填写</button></div>
  </div>
  <div class="foot">AI行家助手 · 内部体验调研 · 数据仅用于产品优化</div>`;
}

renderAll();
</script>
</body>
</html>
